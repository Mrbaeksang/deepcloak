[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepcloak"
version = "0.2.0"
description = "Local-first research tool with explicit fetch decisions, source evidence, and cited reports. CLI and MCP interfaces."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
authors = [{ name = "Mrbaeksang", email = "contact@baeksang.dev" }]
keywords = ["deep-research", "research", "citations", "evidence", "mcp", "llm", "ai-agent", "rag", "local-first"]

# ADR-0001: local-deep-research is pinned with == because the stealth shim
# depends on its internal symbols.
dependencies = [
    "local-deep-research==1.6.11",
    "cloakbrowser>=0.3.27,<0.8",
    "requests>=2.31",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]
rich = ["rich>=13"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
deepcloak = "deepcloak.cli:main"

[project.urls]
Homepage = "https://github.com/Mrbaeksang/deepcloak"
Repository = "https://github.com/Mrbaeksang/deepcloak"
Author = "https://baeksang.dev"

[tool.hatch.build.targets.wheel]
packages = ["src/deepcloak"]

# Keep the PyPI sdist lean — ship code + docs, not the demo media or showcase site.
[tool.hatch.build.targets.sdist]
include = ["src/deepcloak", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
